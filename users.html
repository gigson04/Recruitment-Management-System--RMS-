<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Users — Recruitment Management System
    </title>

    <link
        rel="icon"
        type="image/png"
        href="images/logo.png"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/frost-ui.css"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/responsive.css"
    >

    <link
        rel="stylesheet"
        href="css/users.css"
    >

    <link rel="stylesheet" href="css/quality.css">

</head>


<body
    data-active="Users"
    class="app-page"
>


    <aside
        id="appSidebar"
        class="sidebar glass-panel"
    ></aside>


    <main class="app-main">


        <header
            id="appTopbar"
            class="topbar glass-panel"
        ></header>


        <section class="page-content">


            <div class="page-intro users-intro">

                <div>

                    <p class="eyebrow">
                        Laboratory Activity 24
                    </p>

                    <h2>
                        User Authentication
                    </h2>

                    <p>
                        Manage system user accounts, roles, and account activation status.
                    </p>

                </div>


                <div class="users-actions">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        id="refreshUsers"
                    >
                        Refresh
                    </button>

                </div>

            </div>


            <section
                class="user-summary-grid"
            >

                <article
                    class="glass-panel user-summary-card"
                >

                    <span>
                        Total Users
                    </span>

                    <strong id="totalUsers">
                        0
                    </strong>

                </article>


                <article
                    class="glass-panel user-summary-card"
                >

                    <span>
                        Active
                    </span>

                    <strong id="activeUsers">
                        0
                    </strong>

                </article>


                <article
                    class="glass-panel user-summary-card"
                >

                    <span>
                        Inactive
                    </span>

                    <strong id="inactiveUsers">
                        0
                    </strong>

                </article>


                <article
                    class="glass-panel user-summary-card"
                >

                    <span>
                        Administrators
                    </span>

                    <strong id="administratorUsers">
                        0
                    </strong>

                </article>

            </section>


            <section
                class="glass-panel section-card"
            >


                <div class="section-header">

                    <div>

                        <p class="eyebrow">
                            Account Management
                        </p>

                        <h3>
                            System Users
                        </h3>

                    </div>


                    <span
                        class="section-count"
                        id="usersCount"
                    >
                        0 users
                    </span>

                </div>


                <div class="users-toolbar">

                    <div class="users-search">

                        <label for="userSearch">
                            Search Users
                        </label>

                        <input
                            type="search"
                            id="userSearch"
                            placeholder="Search username or role..."
                        >

                    </div>


                    <div class="users-filter">

                        <label for="userStatusFilter">
                            Status
                        </label>

                        <select
                            id="userStatusFilter"
                        >

                            <option value="ALL">
                                All
                            </option>

                            <option value="Active">
                                Active
                            </option>

                            <option value="Inactive">
                                Inactive
                            </option>

                        </select>

                    </div>


                    <div class="users-filter">

                        <label for="userRoleFilter">
                            Role
                        </label>

                        <select
                            id="userRoleFilter"
                        >

                            <option value="ALL">
                                All Roles
                            </option>

                        </select>

                    </div>

                </div>


                <div class="table-wrap">


                    <table class="users-table">


                        <thead>

                            <tr>

                                <th>
                                    Username
                                </th>

                                <th>
                                    Role
                                </th>

                                <th>
                                    Status
                                </th>

                                <th>
                                    Created
                                </th>

                                <th>
                                    Account
                                </th>

                            </tr>

                        </thead>


                        <tbody
                            id="usersTable"
                        >

                            <tr>

                                <td
                                    colspan="5"
                                    class="table-empty"
                                >
                                    Loading users...
                                </td>

                            </tr>

                        </tbody>


                    </table>


                </div>


            </section>


        </section>


    </main>


       <div
        id="toastRoot"
        class="toast-root"
    ></div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/config.js"></script>

    <script src="js/supabase.js"></script>

    <script src="js/auth.js"></script>

    <script src="js/components.js"></script>

    <script>
        renderShell({
            active: "Users"
        });
    </script>

    <script src="js/users.js"></script>

</body>

</html>
